version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ledger_one_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: ledger_one
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ledger_one_backend
    restart: always
    environment:
      DATABASE_URL: "postgresql+psycopg://postgres:postgrespassword@postgres:5432/ledger_one"
      PROJECT_NAME: "LEDGER//ONE — The Transaction Integrity Console"
      CURRENCY_CODE: "USD"
      CURRENCY_SYMBOL: "$"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ledger_one_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
